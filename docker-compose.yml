# TenderExtractPro — two-image deployment (backend + frontend) with Redis.
#
# Local demo:
#   copy .env.example .env     # then add GROQ_API_KEY
#   docker compose up --build
#   open http://localhost:3000
#
# Publish (public Docker Hub):
#   set DOCKERHUB_USER=your-user
#   docker compose build
#   docker compose push
#   docker pull your-user/tender-extract-backend:latest
#   docker pull your-user/tender-extract-frontend:latest

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKERHUB_USER:-tenderextractpro}/tender-extract-backend:latest
    init: true
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-cpu}
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-en}
      REQUIRE_GPU: "0"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MATCH_AUTORUN: ${MATCH_AUTORUN:-0}
      MANUFACTURERS_DIR: /app/data/manufacturers
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./data:/app/data
      - hf-cache:/home/appuser/.cache/huggingface
      - qdrant-data:/app/qdrant_storage
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-tenderextractpro}/tender-extract-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  hf-cache:
  qdrant-data:
  redis-data:
